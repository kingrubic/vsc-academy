name: vsc-academy-convex

services:
  backend:
    image: ghcr.io/get-convex/convex-backend@sha256:f0de0647e46c0ac830a6dda036ee78e4956cecc00144d951bf39b14cc570ad4d
    stop_grace_period: 10s
    stop_signal: SIGINT
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:3280:3210"
      - "127.0.0.1:3281:3211"
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=vsc-academy-local
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3280
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3281
      - DISABLE_BEACON=true
      - DISABLE_METRICS_ENDPOINT=true
      - DOCUMENT_RETENTION_DELAY=172800
      - DO_NOT_REQUIRE_SSL=true
      - REDACT_LOGS_TO_CLIENT=true
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 20

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard@sha256:b21b95c4abfe543b26d39e0a1e125d65b33bc216f99a0378e9a81642ced2f8c7
    stop_grace_period: 10s
    stop_signal: SIGINT
    restart: unless-stopped
    ports:
      - "127.0.0.1:6796:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3280
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
