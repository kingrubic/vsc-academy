<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />

    <title>Xác minh chứng nhận | VSC Academy</title>
    <link rel="stylesheet" href="/verify-assets/verify.css" />
    <link rel="icon" href="/favicon.ico" sizes="any">
  </head>
  <body>
    <main class="wrap">
      <img src="/assets/logo-vsc-academy-white.webp" alt="VSC Academy" />

      <p id="lead">Nhập Certificate ID để xác minh chứng nhận do VSC Academy cấp.</p>
      <form id="form">
        <label id="lbl">CERTIFICATE ID</label>
        <input id="code" name="code" placeholder="VSC-2026-AIA-8F32K9" required />

      </form>
      <div id="result"></div>
      <p class="lang"><a id="lang-link" href="/en/verify">EN</a></p>
    </main>
    <script src="/verify-assets/verify.js"></script>
