<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>VSC Academy | Learner Portal</title>
    <link rel="stylesheet" href="/portal/portal.css" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  </head>
  <body>
    <div id="auth" class="auth-screen hidden"></div>
    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <a class="brand" data-nav="home">
          <img src="/assets/logo-vsc-academy-white.webp" alt="VSC Academy" width="640" height="463" />
          <small id="brand-sub">LEARNER PORTAL</small>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-user">
          <span class="avatar" id="side-avatar">HV</span>
          <div>
            <b id="side-name"></b>
            <button type="button" id="side-logout" class="linkish"></button>
          </div>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
          <div class="who">
            <nav class="lang" id="lang-switch"></nav>
            <button class="bell" id="bell" type="button" data-nav="announcements">
              <span id="unread-dot" class="hidden"></span>
              ●
            </button>
            <span id="who-name"></span>
            <span class="avatar" id="avatar">HV</span>
          </div>
        </header>
        <div class="page" id="app"></div>
      </div>
      <nav class="bottom-nav" id="bottom-nav"></nav>
      <a id="sticky-join" class="sticky-join hidden" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/portal/portal.js?v=20260816-1"></script>
  </body>
</html>
