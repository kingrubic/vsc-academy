<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VSC Academy | Quản trị</title>
    <link rel="stylesheet" href="/admin/admin.css?v=20260815-1" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  </head>
  <body>
    <div id="login-view" class="login-page hidden">
      <form class="login-card" id="login-form">
        <img src="/assets/logo-vsc-academy-white.webp" alt="VSC Academy" width="166" height="62" />
        <h1 id="login-title">Quản trị</h1>
        <p id="login-lead">Đăng nhập để quản trị khóa học, lịch khai giảng và đăng ký.</p>
        <label for="email">ĐỊA CHỈ EMAIL</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">MẬT KHẨU</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p class="login-error" id="login-error"></p>
        <button type="submit">ĐĂNG NHẬP</button>
      </form>
    </div>
    <div id="password-view" class="login-page hidden">
      <form class="login-card" id="password-form">
        <img src="/assets/logo-vsc-academy-white.webp" alt="VSC Academy" width="166" height="62" />
        <h1>Đổi mật khẩu</h1>
        <p>Lần đăng nhập đầu tiên cần đặt mật khẩu mới. Mật khẩu tạm sẽ không dùng được nữa.</p>
        <label for="current-password">MẬT KHẨU TẠM</label>
        <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />
        <label for="new-password">MẬT KHẨU MỚI</label>
        <input id="new-password" name="newPassword" type="password" minlength="12" autocomplete="new-password" required />
        <label for="confirm-password">XÁC NHẬN MẬT KHẨU MỚI</label>
        <input id="confirm-password" name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required />
        <p class="login-error" id="password-error"></p>
        <button type="submit">LƯU MẬT KHẨU MỚI</button>
      </form>
    </div>
    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <a class="brand" href="/admin">
          <img src="/assets/logo-vsc-academy-white.webp" alt="VSC Academy" width="166" height="62" />
          <small>QUẢN TRỊ CMS</small>
        </a>
        <nav class="nav" id="nav"></nav>
      </aside>
      <div class="main">
        <header class="topbar">
          <h1 id="page-title">Tổng quan</h1>
          <div>
            <span class="who" id="who"></span>
            <button class="btn-ghost" id="logout" type="button">Đăng xuất</button>
          </div>
        </header>
        <div class="page" id="app"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/admin/admin.js?v=20260815-1"></script>
  </body>
</html>
